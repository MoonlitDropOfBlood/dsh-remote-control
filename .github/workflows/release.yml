# 发布流程：推 v* 标签 → 门禁 → npm 发布（两个包）→ 重生成市场索引 → 提交回 main → GitHub Release。
#
# 前置（一次性）：仓库 Settings → Secrets → Actions 加 NPM_TOKEN
# （npmjs.com → Access Tokens → 新建 Automation 类型）。
#
# 发版步骤：同时 bump relay/plugin 的 package.json 版本 → 提交 →
#   git tag v<版本> && git push origin main --tags
# workflow 会完成其余全部动作。已发布的版本自动跳过（重推标签安全）。
name: Release

on:
  push:
    tags: ["v*"]
  # 手动重发（补发 / 上次失败重试）：填版本号即可，不必移动标签
  workflow_dispatch:
    inputs:
      version:
        description: "要发布的版本（如 1.1.4）"
        required: true

permissions:
  contents: write
  id-token: write # npm Trusted Publishing（OIDC）用的；用 NPM_TOKEN 时无副作用

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: 检出（标签触发）
        if: github.event_name == 'push'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 提交索引回 main 需要完整历史
      - name: 检出（手动触发：按输入的版本取标签）
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refs/tags/v${{ inputs.version }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # npm Trusted Publishing（OIDC）要求 npm ≥ 11.5.1。
      # **固定装 npm@11，不要用 @latest**：npm 12 要求 node ^22.22.2 || ^24.15.0 || >=26，
      # runner 的 node 版本可能不满足 → `npm ci` 直接秒挂（实测踩过）。
      # npm 11 支持 node 24 ✓，且满足 OIDC 的 ≥ 11.5.1 ✓。
      # **不设 registry-url**：setup-node 会写一条 _authToken=${NODE_AUTH_TOKEN} 的 .npmrc，
      # 空令牌会盖掉 OIDC 流程；npm 默认注册表本来就是 npmjs.org。
      - name: 准备 npm（OIDC 需要 ≥ 11.5.1）
        run: |
          npm install -g npm@11
          npm --version
          node -e "
            const v = require('child_process').execSync('npm --version').toString().trim();
            const [a, b] = v.split('.').map(Number);
            if (a < 11 || (a === 11 && b < 5)) { console.error('npm ' + v + ' < 11.5.1，OIDC 不可用'); process.exit(1); }
            console.log('npm OK:', v);
          "
          npm config set registry https://registry.npmjs.org/

      - name: 决定版本
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            v="${{ inputs.version }}"
          else
            v="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "发布版本：$v"
      - name: 版本一致性（package.json 必须与标签同步 bump）
        run: |
          v="${{ steps.ver.outputs.version }}"
          rp=$(node -p "require('./relay/package.json').version")
          pp=$(node -p "require('./plugin/package.json').version")
          [ "$rp" = "$v" ] || { echo "relay/package.json 是 $rp，标签是 $v——先同步 bump 再打标签"; exit 1; }
          [ "$pp" = "$v" ] || { echo "plugin/package.json 是 $pp，标签是 $v——先同步 bump 再打标签"; exit 1; }
          # 只发布两个包：插件（含市场索引副本）+ 中继。app 走 AGC，不发 npm。

      - name: 门禁 relay（安装 + 测试）
        working-directory: relay
        run: |
          npm ci
          npm test
      - name: 门禁 plugin（安装）
        working-directory: plugin
        run: npm ci
      - name: 门禁 plugin（语法检查）
        working-directory: plugin
        run: node --check index.js client.js typert.host.js lib/*.mjs scripts/*.mjs
      - name: 门禁 plugin（KAT）
        working-directory: plugin
        run: node -e "import('./lib/protocol.mjs').then(m=>m.assertKat()).then(()=>console.log('KAT OK'))"
      - name: 门禁 plugin（verify-crypto）
        working-directory: plugin
        run: node scripts/verify-crypto.mjs
      - name: 生成市场索引（拷进插件包，让 unpkg 能取到）
        run: |
          node market/generate-index.mjs
          node market/sync-into-plugin.mjs

      - name: 发布 relay（已发布则跳过）
        working-directory: relay
        run: |
          v="${{ steps.ver.outputs.version }}"
          if npm view "@duke-dsh-plugins/dsh-remote-control-relay@$v" version >/dev/null 2>&1; then
            echo "relay@$v 已在 npm 上，跳过发布"
          else
            npm publish --access public
            echo "relay@$v 发布完成"
          fi

      - name: 发布 plugin（已发布则跳过）
        working-directory: plugin
        run: |
          v="${{ steps.ver.outputs.version }}"
          if npm view "@duke-dsh-plugins/dsh-remote-control@$v" version >/dev/null 2>&1; then
            echo "plugin@$v 已在 npm 上，跳过发布"
          else
            npm publish --access public
            echo "plugin@$v 发布完成"
          fi

      - name: 官方校验器验证索引
        run: |
          mkdir -p /tmp/idxval && cd /tmp/idxval
          npm init -y >/dev/null 2>&1
          npm i --silent --no-audit --no-fund @deepseek-ai/dsh-plugin-market-index >/dev/null
          node --input-type=module -e "
            const { readFileSync } = await import('node:fs');
            const m = await import('file:///tmp/idxval/node_modules/@deepseek-ai/dsh-plugin-market-index/lib/index.js');
            const doc = JSON.parse(readFileSync('${{ github.workspace }}/market/index.json', 'utf8'));
            const parsed = m.parseMarketIndex(doc, 'https://example.com/index.json');
            if (!parsed.plugins.some(p => p.versions.some(v => v.version === '${{ steps.ver.outputs.version }}'))) {
              throw new Error('索引里没有 ${{ steps.ver.outputs.version }}');
            }
            console.log('market index valid');
          "

      - name: 索引提交回 main
        run: |
          git config user.name "dsh-remote-control"
          git config user.email "dev@localhost"
          # 发版前生成的那份索引就是权威版本（npm 包里也是这一份）——
          # **不要在这里重新生成**，否则仓库副本与 npm 副本的时间戳会不一致。
          cp market/index.json /tmp/market-index.json
          git checkout main
          git pull --ff-only origin main
          cp /tmp/market-index.json market/index.json
          if git diff --quiet market/index.json; then
            echo "索引无变化"
          else
            git add market/index.json
            git commit -m "Update market index for v${{ steps.ver.outputs.version }}"
            git push origin main
          fi

      - name: 打包产物
        run: |
          mkdir -p release-artifacts
          (cd relay && npm pack --pack-destination ../release-artifacts)
          (cd plugin && npm pack --pack-destination ../release-artifacts)
          cp market/index.json "release-artifacts/market-index-${{ steps.ver.outputs.version }}.json"
          ls -la release-artifacts/

      - name: 从 CHANGELOG.md 抽取本版本段落
        run: |
          v="${{ steps.ver.outputs.version }}"
          awk -v ver="$v" '
            BEGIN { p = 0 }
            /^## \[/ {
              if (index($0, "[" ver "]")) { p = 1; next }
              else if (p) { exit }
            }
            p { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "CHANGELOG.md 里没有 [${v}] 段落——发版必须先补 changelog"; exit 1
          fi
          prev=$(git describe --abbrev=0 --tags "v${v}^" 2>/dev/null || true)
          if [ -n "$prev" ]; then
            printf '\n\n**Full changelog**: https://github.com/MoonlitDropOfBlood/dsh-remote-control/compare/%s...v%s\n' "$prev" "$v" >> release-notes.md
          else
            printf '\n\n**Tags**: https://github.com/MoonlitDropOfBlood/dsh-remote-control/tags\n' >> release-notes.md
          fi
          head -5 release-notes.md

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          generate_release_notes: true
          files: |
            release-artifacts/*.tgz
            release-artifacts/*.json
