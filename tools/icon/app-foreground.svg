    <!-- phone slab -->
    <rect x="16.5" y="9.5" width="13" height="23" rx="3" stroke-width="2.6"/>
    <!-- terminal caret on screen -->
    <path d="M20.5 16.2 l3 2.9 -3 2.9" stroke-width="2.1"/>
    <path d="M25 22.4 h3.2" stroke-width="2.1"/>
    <!-- signal arcs toward the relay -->
